services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaign
      POSTGRES_DB: campaign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - campaign-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "campaign", "-d", "campaign"]
      interval: 5s
      timeout: 5s
      retries: 12
    # The entrypoint needs these to initialise and own its data directory before dropping to the postgres user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
  campaign:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3018:3018"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3018
      DATA_DIR: /app/data
      DATABASE_URL: postgres://campaign:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/campaign
    # The app refuses to serve an unmigrated schema, so apply pending migrations first (idempotent, advisory-locked).
    command: ["sh", "-c", "node server/cli.ts migrate && exec node server/index.ts"]
    volumes:
      # The data directory keeps the session secret; application data lives in PostgreSQL.
      - campaign-data:/app/data
    # The app writes only to its data volume and /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3018/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  campaign-data:
  campaign-postgres:
